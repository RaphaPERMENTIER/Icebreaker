<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2937">
<title>Olympiades</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏅%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#111827;--mut:#5b6472;--bg:#f4f1ea;--card:#fff;--line:#d9d4c8;--dark:#1f2937;--ok:#1b7f3b;--warn:#b42318}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:.04em}
header .rot{margin-left:auto;font-size:14px;background:#374151;border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 12px;line-height:1.15}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 8px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn,button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:52px;padding:10px 12px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn.big{font-size:20px;min-height:64px}
.btn.dark,button.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.wide{width:100%;margin:8px 0}
button:disabled{opacity:.5}
.now{background:var(--dark);color:#fff;border:0}
.now .lab{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.now .act{font-size:28px;font-weight:800;line-height:1.15;margin:4px 0}
.now .who{font-size:18px}
.now .next{margin-top:12px;padding-top:10px;border-top:1px solid #4b5563;font-size:15px;opacity:.9}
.row{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.row .t{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3f4f6;padding:6px 4px;font-size:12px;color:var(--mut)}
.row .t b{font-size:20px;color:var(--ink);line-height:1}
.row .bar{flex:0 0 8px}
.row .d{flex:1;padding:10px 12px;min-width:0}
.row .d b{font-size:17px}
.row .d div{font-size:14px;color:var(--mut)}
.row.cur{outline:3px solid var(--dark);outline-offset:-1px}
.row.done{opacity:.6}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 7px;border-radius:10px;background:#eceadf;border:1px solid var(--line);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.num.sm{min-width:28px;height:28px;padding:0 5px;border-radius:8px;font-size:15px}
.num.xl{min-width:78px;height:78px;border-radius:20px;font-size:44px}
.num.ok{background:#e7f5ec;border-color:#b7e0c5;color:var(--ok)}
.teamhead{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.teamhead .lab{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{justify-content:space-between;text-align:left;font-weight:600;min-height:58px}
.opts button span{font-weight:800;white-space:nowrap;margin-left:10px}
.opts button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{min-width:56px}
.stepper div{flex:1;text-align:center;font-weight:800;font-size:18px}
.acts{display:grid;gap:10px}
.act{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:14px;min-height:66px;text-decoration:none;color:var(--ink)}
.act b{flex:1;font-size:19px}
.act small{color:var(--mut);font-size:13px;font-weight:700;white-space:nowrap}
.back{display:inline-block;color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;padding:6px 0}
.ahead{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.ahead h1{margin:2px 0 0;font-size:24px}
.prog{font-size:14px;color:var(--mut);margin:14px 0 4px}
.mch{padding:0;overflow:hidden}
.mch.live{outline:3px solid var(--dark);outline-offset:-1px}
.mhead{display:flex;width:100%;align-items:center;gap:12px;justify-content:flex-start;text-align:left;background:none;border:0;border-radius:0;padding:12px 14px;min-height:72px}
.mhead.static{cursor:default}
.mno{flex:0 0 42px;height:42px;border-radius:12px;background:#f3f4f6;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.mch.ok .mno{background:#e7f5ec;color:var(--ok)}
.mi{flex:1;min-width:0}
.mi small{display:block;margin-top:3px;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small b{color:var(--ok)}
.vs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vs em{font-style:normal;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.st{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ok);font-weight:800;font-size:18px}
.st em{font-style:normal;color:var(--mut);font-size:12px}
.mch .opts{margin:0;padding:0 14px 14px}
.bo3{padding:0 14px 14px}
.sc{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 12px}
.sc b{font-size:34px;font-variant-numeric:tabular-nums}
.ask{text-align:center;font-weight:700;color:var(--mut);font-size:14px;margin-bottom:8px}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adds button{min-height:80px;border:2px solid var(--dark)}
.adds .num{min-width:54px;height:54px;border-radius:14px;font-size:28px}
.fin{text-align:center;font-weight:700;color:var(--ok);margin-bottom:10px}
.clr{width:100%;margin-top:10px;min-height:46px;font-size:14px;color:var(--mut)}
.chlist{padding:0 14px 10px}
.ch{display:grid;grid-template-columns:56px 1fr 1fr 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #eee}
.ch input{text-align:center;padding:8px 4px}
.ch button{min-height:50px;padding:4px}
.cht{display:flex;flex-direction:column;align-items:center;gap:2px}
.cht small{color:var(--mut);font-size:11px;white-space:nowrap}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #eee;font-size:15px}
th{background:#f3f4f6;font-size:12px;text-transform:uppercase;color:var(--mut)}
td.l,th.l{text-align:left}
input{font:inherit;font-size:18px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:50px;width:100%}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--warn);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:9;text-align:center}
#toast.ok{background:var(--ok)}
a.link{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header><a href="#/">🏅 OLYMPIADES</a><span class="rot" id="hrot"></span></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const SB='https://erlxchgzqfqbgjvxkzad.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVybHhjaGd6cWZxYmdqdnhremFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTk5ODQsImV4cCI6MjEwNzAzNTk4NH0.aoJlQXccHcQBZ6K9MuNO4-4fV9M6IOWqa-ppBMZeBUM';
const G=[[[[9,10],[14,16]],[13,18],[5,17],[11,15],[12,19],[4,8],[6],[1,2,3,7]],[[[8,11],[12,18]],[14,17],[6,15],[16,19],[2,10],[1,5],[3,7,13],[4,9]],[[[4,5],[14,15]],[7,10],[2,11],[8,9],[1,12],[16,18],[17],[3,6,13,19]],[[[3,12],[13,17]],[5,8],[1,16],[10,18],[4,6],[7,11],[9,19],[2,14,15]],[[[2,6],[7,9]],[15,16],[4,12],[1,14],[3,11],[17,19],[5,8],[10,13,18]],[[[4,11],[16,17]],[5,9],[10,19],[3,6],[14,18],[2,13],[1,15],[7,8,12]],[[[2,8],[14,19]],[1,11],[3,9],[4,13],[7,15],[6,10],[12],[5,16,17,18]],[[[1,10],[13,15]],[3,19],[7,8],[6,17],[5,16],[12,14],[2,4,18],[9,11]],[[[5,6],[18,19]],[2,4],[13,14],[7,12],[9,17],[3,8],[11],[1,10,15,16]],[[[1,3],[4,7]],[6,12],[17,18],[2,5],[8,13],[9,15],[10,14,16],[11,19]]];
const K=['beret','tir','gonflable','sumo','parcours','blindtest','chasse','pause'];
const A={beret:['Béret','#F4B183'],tir:['Tir à la corde','#9DC3E6'],gonflable:['Parcours gonflable','#A9D18E'],sumo:['Sumo','#FFD966'],parcours:['Parcours','#C5A3D9'],blindtest:['Blindtest','#F4A6B7'],chasse:['Chasse au trésor','#8FD3C8'],pause:['Pause','#E3E3E3']};
const NR=10, NT=19, $=s=>document.querySelector(s), app=$('#app');
const hh=r=>{const m=14*60+15*(r-1);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const nm=a=>a.join(' + ');
const chips=(a,c)=>a.map(t=>`<span class="num${c?' '+c:''}">${t}</span>`).join('');
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let ROT=ls.get('rot')??0, timer=null;

function slot(t,r){ // ce que fait l'équipe t à la rotation r (1..10)
  const g=G[r-1];
  for(let i=0;i<8;i++){
    const k=K[i];
    if(k==='beret'){for(let c=0;c<2;c++)if(g[0][c].includes(t))return{k,mates:g[0][c].filter(x=>x!==t),opp:g[0][1-c]}}
    else if(g[i].includes(t))return{k,mates:[],opp:i<6?g[i].filter(x=>x!==t):[]};
  }
}
function who(s){
  if(s.k==='beret')return'avec '+s.mates[0]+' · contre '+s.opp.join(' et ');
  if(s.opp.length)return'contre '+s.opp[0];
  if(s.k==='chasse')return'Contre la montre';
  return'Soufflez un peu';
}
async function rpc(fn,args){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function setRot(n){if(typeof n!=='number')return;ROT=n;ls.set('rot',n);$('#hrot').textContent=n<1?'Début 14h00':n>NR?'Terminé':'Rotation '+n+' / '+NR}
const rotLabel=n=>n<1?'Pas commencé':n>NR?'Terminé':'Rotation '+n;

/* ---------- Accueil ---------- */
function home(){
  const me=ls.get('me');
  let h='<h1>Choisissez votre équipe</h1>';
  if(me)h+=`<a class="btn dark big wide" href="#/equipe/${me.team}">Mon équipe · ${me.team}</a>`;
  h+='<div class="grid">';
  for(let t=1;t<=NT;t++)h+=`<a class="btn big" href="#/equipe/${t}">${t}</a>`;
  h+='</div>';
  h+='<p class="mut" style="text-align:center;margin-top:28px"><a class="link" href="#/orga">Espace organisateurs</a></p>';
  app.innerHTML=h;
  rpc('public_state').then(s=>setRot(s.rotation)).catch(()=>{});
}

/* ---------- Page équipe ---------- */
function team(t){
  const me=ls.get('me'), mine=me&&me.team===t;
  let h=`<div class="teamhead"><span class="num xl">${t}</span><span class="lab">${mine?'Votre équipe':'Équipe'}</span></div>`;
  const r=ROT;
  if(r>=1&&r<=NR){
    const s=slot(t,r), n=r<NR?slot(t,r+1):null;
    h+=`<div class="card now"><div class="lab">Maintenant · rotation ${r}</div><div class="act">${A[s.k][0]}</div><div class="who">${who(s)}</div>`+
       (n?`<div class="next">Ensuite : <b>${A[n.k][0]}</b> — ${who(n)}</div>`:'<div class="next">C\'est la dernière rotation !</div>')+'</div>';
  }else if(r<1){
    const s=slot(t,1);
    h+=`<div class="card now"><div class="lab">Début à 14h00</div><div class="act">${A[s.k][0]}</div><div class="who">${who(s)}</div></div>`;
  }else h+='<div class="card now"><div class="act">C\'est terminé, bravo !</div><div class="who">Rendez-vous pour la remise des prix.</div></div>';
  h+='<div class="card mut">Les points et le classement sont tenus par les organisateurs. Résultats à la remise des prix !</div>';
  h+='<h2>Votre parcours</h2>';
  for(let i=1;i<=NR;i++){
    const s=slot(t,i);
    h+=`<div class="row${i===r?' cur':''}${i<r?' done':''}"><div class="t"><b>${i}</b>${hh(i)}</div><div class="bar" style="background:${A[s.k][1]}"></div><div class="d"><b>${A[s.k][0]}</b><div>${who(s)}</div></div></div>`;
  }
  h+='<p class="mut">Horaires indicatifs : suivez le signal des organisateurs.</p>';
  app.innerHTML=h;
}
async function loadTeam(t){
  try{const s=await rpc('public_state');setRot(s.rotation)}catch(e){}
  if(location.hash==='#/equipe/'+t)team(t);
}
async function scan(tok){
  app.innerHTML='<p>Connexion à votre équipe…</p>';
  try{
    const d=await rpc('team_view',{p_token:tok});
    if(!d){app.innerHTML='<h1>Code inconnu</h1><p>Ce QR code n\'est pas reconnu. Demandez à un organisateur.</p><a class="btn wide" href="#/">Accueil</a>';return}
    ls.set('me',{team:d.team,token:tok});ls.del('view');setRot(d.rotation);location.replace('#/equipe/'+d.team);
  }catch(e){app.innerHTML='<h1>Pas de réseau</h1><p>Impossible de vérifier le code pour le moment.</p><button class="wide dark" onclick="route()">Réessayer</button>'}
}

/* ---------- Organisateurs ---------- */
const ACTS=[...K.slice(0,6),'chasse'];
const BO3=['tir','gonflable','sumo'], MB=3, PM=2; // 3 manches, 2 points par manche gagnée
let O={data:null,busy:false,open:{},act:null,scroll:false};
const code=()=>{try{return sessionStorage.getItem('orga')||localStorage.getItem('orga')}catch(e){return null}};
function orgaLogin(msg){
  app.innerHTML=`<h1>Espace organisateurs</h1><div class="card"><p>Entrez le code organisateur.</p><input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code" aria-label="Code organisateur"><button class="dark wide" id="go">Entrer</button>${msg?`<p style="color:var(--warn);font-weight:600">${msg}</p>`:''}</div>`;
  const go=async()=>{
    const v=$('#c').value.trim();if(!v)return;$('#go').disabled=true;
    try{const d=await rpc('orga_all',{p_code:v});if(!d)return orgaLogin('Code incorrect.');try{localStorage.setItem('orga',v)}catch(e){}O.data=d;setRot(d.rotation);orga()}
    catch(e){orgaLogin('Pas de réseau, réessayez.')}
  };
  $('#go').onclick=go;$('#c').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function orgaLoad(){
  try{const d=await rpc('orga_all',{p_code:code()});if(!d){ls.del('orga');return orgaLogin('Code incorrect.')}O.data=d;setRot(d.rotation);if(location.hash.startsWith('#/orga')&&!O.busy)orga()}
  catch(e){if(!O.data)orgaLogin('Pas de réseau, réessayez.')}
}
function manche(k,r){ // la rencontre d'une activité à la manche r
  const g=G[r-1], i=K.indexOf(k);
  if(k==='beret')return{k,r,a:g[0][0],b:g[0][1]};
  if(i<6)return{k,r,a:[g[i][0]],b:[g[i][1]]};
  return{k,r,teams:g[i]};
}
function options(m){ // épreuves notées en une rencontre : béret, parcours, blindtest
  const a=nm(m.a), b=nm(m.b), v=m.a.length>1?' gagnent':' gagne';
  return[[a+v,5,0,'Victoire','Défaite'],[b+v,0,5,'Défaite','Victoire']];
}
function pts(r,k,t){const x=O.data.results.find(x=>x.rotation===r&&x.activity===k&&x.team===t);return x?x.points:null}
const bo3=k=>BO3.includes(k);
const dtl=(a,b)=>'Manches '+a+'–'+b;
function wins(r,k,m){const pa=pts(r,k,m.a[0]);return pa===null?null:[pa/PM,(pts(r,k,m.b[0])||0)/PM]} // manches gagnées, relues depuis les points
function full(k,r,m){const w=bo3(k)?wins(r,k,m):null;return bo3(k)?!!w&&w[0]+w[1]>=MB:pts(r,k,m.a[0])!==null}
function done(k){let n=0;for(let r=1;r<=NR;r++)if(full(k,r,manche(k,r)))n++;return n}
const isOpen=(k,r)=>O.open[r]!==undefined?O.open[r]:!full(k,r,manche(k,r));

function orga(){
  if(!code())return orgaLogin();
  if(!O.data){app.innerHTML='<p>Chargement…</p>';return orgaLoad()}
  const v=location.hash.split('/')[2]||'';
  if(v==='classement')return orgaRank();
  if(ACTS.includes(v))return orgaAct(v);
  orgaHome();
}
function orgaHome(){
  const d=O.data, last=ls.get('act');
  O.act=null;
  let h='<h1>Organisateurs</h1>';
  h+=`<div class="card"><div class="mut">Rotation affichée aux équipes</div><div class="stepper"><button data-rot="${d.rotation-1}" ${d.rotation<1?'disabled':''} aria-label="Rotation précédente">◀</button><div>${rotLabel(d.rotation)}</div><button class="dark" data-rot="${d.rotation+1}" ${d.rotation>NR?'disabled':''} aria-label="Rotation suivante">▶</button></div></div>`;
  h+='<h2>Quelle activité animez-vous ?</h2>';
  if(last&&ACTS.includes(last))h+=`<a class="btn dark big wide" href="#/orga/${last}">Continuer · ${A[last][0]}</a>`;
  h+='<div class="acts">';
  for(const k of ACTS){
    const tot=k==='chasse'?NT:NR, n=k==='chasse'?d.chasse.length:done(k);
    h+=`<a class="act" href="#/orga/${k}" style="--c:${A[k][1]}"><b>${A[k][0]}</b><small>${n}/${tot}${n>=tot?' ✓':''}</small></a>`;
  }
  h+='</div>';
  h+='<a class="btn wide" style="margin-top:16px" href="#/orga/classement">Classement</a>';
  h+='<button class="wide" id="out">Se déconnecter</button>';
  app.innerHTML=h;
}
function orgaAct(k){
  const d=O.data;
  if(O.act!==k){O.act=k;O.open={};O.scroll=true;ls.set('act',k)}
  let h=`<a class="back" href="#/orga">◀ Activités</a><div class="ahead" style="--c:${A[k][1]}"><div class="mut">Vous animez</div><h1>${A[k][0]}</h1></div>`;
  if(k==='chasse')h+=chasse();
  else{
    h+=`<div class="prog"><b>${done(k)}/${NR}</b> rotations enregistrées${bo3(k)?` · ${MB} manches, ${PM} pts par manche gagnée`:''}</div>`;
    for(let r=1;r<=NR;r++){
      const m=manche(k,r), open=isOpen(k,r), live=r===d.rotation, fin=full(k,r,m);
      let sub=hh(r), body='';
      if(live)sub+=' · <b>en cours</b>';
      if(bo3(k)){
        const w=wins(r,k,m)||[0,0], np=w[0]+w[1];
        if(np)sub+=' · '+w[0]+' – '+w[1]+(fin?` (${w[0]*PM}–${w[1]*PM} pts)`:' · manche '+(np+1)+'/'+MB);
        if(open){
          body=`<div class="bo3"><div class="sc"><span class="num">${m.a[0]}</span><b>${w[0]} – ${w[1]}</b><span class="num">${m.b[0]}</span></div>`;
          if(fin)body+=`<div class="fin">${MB} manches jouées · ${w[0]>w[1]?m.a[0]:m.b[0]} gagne · ${w[0]*PM} – ${w[1]*PM} pts</div>`;
          else body+=`<div class="ask">Qui gagne la manche ${np+1} ?</div><div class="adds">`+
            `<button data-add="a" data-k="${k}" data-r="${r}" aria-label="Manche gagnée par l'équipe ${m.a[0]}"><span class="num">${m.a[0]}</span></button>`+
            `<button data-add="b" data-k="${k}" data-r="${r}" aria-label="Manche gagnée par l'équipe ${m.b[0]}"><span class="num">${m.b[0]}</span></button></div>`;
          if(np)body+=`<button class="clr" data-clr="1" data-k="${k}" data-r="${r}">Effacer la rencontre</button>`;
          body+='</div>';
        }
      }else{
        const o=options(m), pa=pts(r,k,m.a[0]), pb=pts(r,k,m.b[0]), sel=pa!==null?o.findIndex(x=>x[1]===pa&&x[2]===pb):-1;
        if(pa!==null)sub+=' · '+(sel>-1?o[sel][0]+` (${o[sel][1]}–${o[sel][2]})`:pa+'–'+pb);
        if(open){
          body='<div class="opts">';
          o.forEach((x,i)=>{body+=`<button data-k="${k}" data-r="${r}" data-i="${i}" class="${pa===x[1]&&pb===x[2]?'on':''}">${x[0]}<span>${x[1]} – ${x[2]}</span></button>`});
          body+='</div>';
        }
      }
      h+=`<div class="card mch${live?' live':''}${fin?' ok':''}">`+
         `<button class="mhead" data-open="${r}" aria-expanded="${open}"><span class="mno">${r}</span><span class="mi"><span class="vs">${chips(m.a)}<em>contre</em>${chips(m.b)}</span><small>${sub}</small></span><span class="st">${fin?'✓':''}<em>${open?'▲':'▼'}</em></span></button>`+body+'</div>';
    }
    h+=`<p class="mut">${bo3(k)?'Notez chaque manche dès qu\'elle est finie : le score est enregistré au fur et à mesure.':'Touchez le résultat pour l\'enregistrer, touchez-le à nouveau pour l\'effacer.'}</p>`;
  }
  app.innerHTML=h;
  if(O.scroll){O.scroll=false;const el=document.querySelector('.mch.live');if(el)setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),80)}
}
function chasse(){
  const d=O.data, n=d.chasse.length;
  let h=`<div class="prog"><b>${n}/${NT}</b> temps saisis${n<NT?' · le plus rapide marque 19 points, puis 18, 17… Les points restent provisoires et masqués aux équipes tant qu\'il en manque.':' · points définitifs'}</div>`;
  for(let r=1;r<=NR;r++){
    const m=manche('chasse',r), live=r===d.rotation;
    h+=`<div class="card mch${live?' live':''}"><div class="mhead static"><span class="mno">${r}</span><span class="mi"><span class="vs">${chips(m.teams)}</span><small>${hh(r)}${live?' · <b>en cours</b>':''}</small></span></div><div class="chlist">`;
    for(const t of m.teams){
      const c=d.chasse.find(x=>x.team===t);
      h+=`<div class="ch"><div class="cht"><span class="num${c?' ok':''}">${t}</span>${c?`<small>${c.points} pts</small>`:''}</div><input inputmode="numeric" id="m${t}" placeholder="min" aria-label="Minutes équipe ${t}" value="${c?Math.floor(c.seconds/60):''}"><input inputmode="numeric" id="s${t}" placeholder="sec" aria-label="Secondes équipe ${t}" value="${c?c.seconds%60:''}"><button data-ch="${t}" class="${c?'':'dark'}">OK</button></div>`;
    }
    h+='</div></div>';
  }
  return h+'<p class="mut">Pour effacer un temps, videz les deux cases puis touchez OK.</p>';
}
function orgaRank(){
  const d=O.data, rows=[];
  O.act=null;
  for(let t=1;t<=NT;t++){const e=d.results.filter(x=>x.team===t), c=d.chasse.find(x=>x.team===t);const ep=e.reduce((s,x)=>s+x.points,0), cp=c?c.points:0;rows.push({t,ep,cp,has:!!c,tot:ep+cp})}
  rows.sort((a,b)=>b.tot-a.tot||a.t-b.t);
  const fin=d.chasse.length===NT;
  let h=`<a class="back" href="#/orga">◀ Activités</a><h1>Classement</h1><p class="mut">Visible uniquement ici. ${d.results.length} résultats d'équipe saisis${fin?'':' · chasse au trésor provisoire ('+d.chasse.length+'/'+NT+' temps)'}.</p><table><tr><th>Rang</th><th class="l">Éq.</th><th>Épreuves</th><th>Chasse</th><th>Total</th></tr>`;
  rows.forEach(x=>{const rk=rows.findIndex(y=>y.tot===x.tot)+1;h+=`<tr><td><b>${rk}</b></td><td class="l"><span class="num sm">${x.t}</span></td><td>${x.ep}</td><td>${x.has?x.cp+(fin?'':'*'):'–'}</td><td><b>${x.tot}</b></td></tr>`});
  app.innerHTML=h+'</table>';
}
app.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!location.hash.startsWith('#/orga')||!O.data)return;
  const ds=b.dataset;
  if(ds.open!==undefined){const r=+ds.open, k=O.act;O.open[r]=!isOpen(k,r);return orga()}
  if(b.id==='out'){ls.del('orga');ls.del('act');try{sessionStorage.removeItem('orga');localStorage.removeItem('orga')}catch(e){}O.data=null;return orgaLogin()}
  if(O.busy)return;
  let call, after;
  if(ds.rot!==undefined){const n=+ds.rot;call=()=>rpc('orga_rotation',{p_code:code(),p_n:n})}
  else if(ds.add!==undefined||ds.clr!==undefined){
    const k=ds.k, r=+ds.r, m=manche(k,r), w=wins(r,k,m)||[0,0], clear=ds.clr!==undefined;
    if(!clear&&w[0]+w[1]>=MB)return toast('Les '+MB+' manches sont déjà notées');
    if(!clear)w[ds.add==='a'?0:1]++;
    const rows=[...m.a.map(t=>({team:t,points:clear?null:w[0]*PM,detail:dtl(w[0],w[1])})),...m.b.map(t=>({team:t,points:clear?null:w[1]*PM,detail:dtl(w[1],w[0])}))];
    call=()=>rpc('orga_save',{p_code:code(),p_rotation:r,p_activity:k,p_rows:rows});
    after=()=>{O.open[r]=clear||w[0]+w[1]<MB};
  }
  else if(ds.k){
    const r=+ds.r, m=manche(ds.k,r), o=options(m)[+ds.i], clear=b.classList.contains('on');
    const rows=[...m.a.map(t=>({team:t,points:clear?null:o[1],detail:o[3]})),...m.b.map(t=>({team:t,points:clear?null:o[2],detail:o[4]}))];
    call=()=>rpc('orga_save',{p_code:code(),p_rotation:r,p_activity:ds.k,p_rows:rows});
    after=()=>{O.open[r]=clear};
  }else if(ds.ch){
    const t=+ds.ch, mv=$('#m'+t).value.trim(), sv=$('#s'+t).value.trim();
    let sec=null;
    if(mv!==''||sv!==''){sec=(parseInt(mv||'0',10)||0)*60+(parseInt(sv||'0',10)||0);if(!(sec>0&&sec<=36000)||(parseInt(sv||'0',10)||0)>59)return toast('Temps invalide')}
    call=()=>rpc('orga_chasse',{p_code:code(),p_team:t,p_seconds:sec});
  }else return;
  O.busy=true;b.disabled=true;
  try{const ok=await call();if(!ok)throw 0;O.data=await rpc('orga_all',{p_code:code()});setRot(O.data.rotation);if(after)after();toast('Enregistré',true)}
  catch(err){toast('Non enregistré : pas de réseau ?')}
  O.busy=false;orga();
});

/* ---------- Routage ---------- */
function route(){
  clearInterval(timer);$('#toast').style.display='none';
  const p=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(p[0]==='equipe'&&+p[1]>=1&&+p[1]<=NT){const t=+p[1];team(t);loadTeam(t);timer=setInterval(()=>{if(!document.hidden)loadTeam(t)},20000)}
  else if(p[0]==='k'&&p[1])scan(p[1]);
  else if(p[0]==='orga'){orga();if(code()&&O.data)orgaLoad();timer=setInterval(()=>{if(!document.hidden&&code()&&!O.busy&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))orgaLoad()},20000)}
  else home();
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)route()});
setRot(ROT);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
