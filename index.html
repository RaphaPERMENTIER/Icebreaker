<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2937">
<title>Olympiades</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏅%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#111827;--mut:#5b6472;--bg:#f4f1ea;--card:#fff;--line:#d9d4c8;--dark:#1f2937;--ok:#1b7f3b;--warn:#b42318}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:.04em}
header .rot{margin-left:auto;font-size:14px;background:#374151;border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 12px;line-height:1.15}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 8px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn,button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:52px;padding:10px 12px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn.big{font-size:20px;min-height:64px}
.btn.dark,button.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.wide{width:100%;margin:8px 0}
button:disabled{opacity:.5}
.now{background:var(--dark);color:#fff;border:0}
.now .lab{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.now .act{font-size:28px;font-weight:800;line-height:1.15;margin:4px 0}
.now .who{font-size:18px}
.now .next{margin-top:12px;padding-top:10px;border-top:1px solid #4b5563;font-size:15px;opacity:.9}
.row{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.row .t{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3f4f6;padding:6px 4px;font-size:12px;color:var(--mut)}
.row .t b{font-size:20px;color:var(--ink);line-height:1}
.row .bar{flex:0 0 8px}
.row .d{flex:1;padding:10px 12px;min-width:0}
.row .d b{font-size:17px}
.row .d div{font-size:14px;color:var(--mut)}
.row .p{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:8px 12px;font-weight:800;font-size:18px;white-space:nowrap}
.row .p small{font-weight:500;font-size:12px;color:var(--mut)}
.row.cur{outline:3px solid var(--dark);outline-offset:-1px}
.row.done{opacity:.6}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.total b{font-size:32px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;min-height:46px}
.tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.rots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.rots button{min-height:46px;padding:4px}
.rots button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.rots button.live{box-shadow:inset 0 -5px 0 var(--ok)}
.match h3{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{justify-content:space-between;text-align:left;font-weight:600}
.opts button span{font-weight:800;white-space:nowrap;margin-left:10px}
.opts button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{min-width:56px}
.stepper div{flex:1;text-align:center;font-weight:800;font-size:18px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #eee;font-size:15px}
th{background:#f3f4f6;font-size:12px;text-transform:uppercase;color:var(--mut)}
td.l,th.l{text-align:left}
input{font:inherit;font-size:18px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:50px;width:100%}
.ch{display:grid;grid-template-columns:1fr 64px 64px 60px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.ch input{text-align:center;padding:8px 4px}
.ch button{min-height:50px;padding:4px}
.ch small{display:block;color:var(--mut);font-size:12px}
.plan td{font-size:14px;padding:8px 4px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--warn);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:9;text-align:center}
#toast.ok{background:var(--ok)}
a.link{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header><a href="#/">🏅 OLYMPIADES</a><span class="rot" id="hrot"></span></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const SB='https://erlxchgzqfqbgjvxkzad.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVybHhjaGd6cWZxYmdqdnhremFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTk5ODQsImV4cCI6MjEwNzAzNTk4NH0.aoJlQXccHcQBZ6K9MuNO4-4fV9M6IOWqa-ppBMZeBUM';
const G=[[[[9,10],[14,16]],[13,18],[5,17],[11,15],[12,19],[4,8],[6],[1,2,3,7]],[[[8,11],[12,18]],[14,17],[6,15],[16,19],[2,10],[1,5],[3,7,13],[4,9]],[[[4,5],[14,15]],[7,10],[2,11],[8,9],[1,12],[16,18],[17],[3,6,13,19]],[[[3,12],[13,17]],[5,8],[1,16],[10,18],[4,6],[7,11],[9,19],[2,14,15]],[[[2,6],[7,9]],[15,16],[4,12],[1,14],[3,11],[17,19],[5,8],[10,13,18]],[[[4,11],[16,17]],[5,9],[10,19],[3,6],[14,18],[2,13],[1,15],[7,8,12]],[[[2,8],[14,19]],[1,11],[3,9],[4,13],[7,15],[6,10],[12],[5,16,17,18]],[[[1,10],[13,15]],[3,19],[7,8],[6,17],[5,16],[12,14],[2,4,18],[9,11]],[[[5,6],[18,19]],[2,4],[13,14],[7,12],[9,17],[3,8],[11],[1,10,15,16]],[[[1,3],[4,7]],[6,12],[17,18],[2,5],[8,13],[9,15],[10,14,16],[11,19]]];
const K=['beret','tir','gonflable','sumo','parcours','blindtest','chasse','pause'];
const A={beret:['Béret','#F4B183'],tir:['Tir à la corde','#9DC3E6'],gonflable:['Parcours gonflable','#A9D18E'],sumo:['Sumo','#FFD966'],parcours:['Parcours','#C5A3D9'],blindtest:['Blindtest','#F4A6B7'],chasse:['Chasse au trésor','#8FD3C8'],pause:['Pause','#E3E3E3']};
const NR=10, NT=19, $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hh=r=>{const m=14*60+15*(r-1);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const eq=a=>a.map(x=>'Éq. '+x).join(' + ');
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let ROT=ls.get('rot')??0, timer=null;

function slot(t,r){ // ce que fait l'équipe t à la rotation r (1..10)
  const g=G[r-1];
  for(let i=0;i<8;i++){
    const k=K[i];
    if(k==='beret'){for(let c=0;c<2;c++)if(g[0][c].includes(t))return{k,mates:g[0][c].filter(x=>x!==t),opp:g[0][1-c]}}
    else if(g[i].includes(t))return{k,mates:[],opp:i<6?g[i].filter(x=>x!==t):[]};
  }
}
function who(s){
  if(s.k==='beret')return'avec Éq. '+s.mates[0]+' · contre '+eq(s.opp).replace(' + ',' et ');
  if(s.opp.length)return'contre Éq. '+s.opp[0];
  if(s.k==='chasse')return'Contre la montre';
  return'Soufflez un peu';
}
async function rpc(fn,args){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function setRot(n){if(typeof n!=='number')return;ROT=n;ls.set('rot',n);$('#hrot').textContent=n<1?'Début 14h00':n>NR?'Terminé':'Rotation '+n+' / '+NR}
const rotLabel=n=>n<1?'Pas commencé':n>NR?'Terminé':'Rotation '+n;

/* ---------- Accueil ---------- */
function home(){
  const me=ls.get('me');
  let h='<h1>Choisissez votre équipe</h1>';
  if(me)h+=`<a class="btn dark big wide" href="#/equipe/${me.team}">Mon équipe : Équipe ${me.team}</a>`;
  h+='<div class="grid">';
  for(let t=1;t<=NT;t++)h+=`<a class="btn big" href="#/equipe/${t}">${t}</a>`;
  h+='</div><a class="btn wide" style="margin-top:18px" href="#/planning">Planning général</a>';
  h+='<p class="mut" style="text-align:center;margin-top:28px"><a class="link" href="#/orga">Espace organisateurs</a></p>';
  app.innerHTML=h;
  rpc('public_state').then(s=>setRot(s.rotation)).catch(()=>{});
}

/* ---------- Page équipe ---------- */
function team(t){
  const me=ls.get('me'), mine=me&&me.team===t, data=mine?ls.get('view'):null;
  const res={}; if(data)for(const x of data.results)res[x.rotation]=x;
  let h=`<h1>Équipe ${t}</h1>`;
  const r=ROT;
  if(r>=1&&r<=NR){
    const s=slot(t,r), n=r<NR?slot(t,r+1):null;
    h+=`<div class="card now"><div class="lab">Maintenant · rotation ${r}</div><div class="act">${A[s.k][0]}</div><div class="who">${who(s)}</div>`+
       (n?`<div class="next">Ensuite : <b>${A[n.k][0]}</b> — ${who(n)}</div>`:'<div class="next">C\'est la dernière rotation !</div>')+'</div>';
  }else if(r<1){
    const s=slot(t,1);
    h+=`<div class="card now"><div class="lab">Début à 14h00</div><div class="act">${A[s.k][0]}</div><div class="who">${who(s)}</div></div>`;
  }else h+='<div class="card now"><div class="act">C\'est terminé, bravo !</div><div class="who">Rendez-vous pour la remise des prix.</div></div>';
  if(mine&&data){
    let tot=0;for(const x of data.results)tot+=x.points;
    const cp=data.chasse&&data.chasse.points;
    if(cp)tot+=cp;
    h+=`<div class="card total"><span>Vos points${data.chasse&&!cp?' <span class="mut">(hors chasse au trésor)</span>':''}</span><b>${tot}</b></div>`;
  }else if(mine)h+='<div class="card mut">Chargement de vos points…</div>';
  else h+='<div class="card mut">Pour voir vos points, scannez le QR code de votre équipe.</div>';
  h+='<h2>Votre parcours</h2>';
  for(let i=1;i<=NR;i++){
    const s=slot(t,i), x=res[i];
    let p='';
    if(mine&&data){
      if(s.k==='chasse'&&data.chasse){const c=data.chasse,m=Math.floor(c.seconds/60),sec=String(c.seconds%60).padStart(2,'0');p=`<div class="p">${c.points?c.points+' pts':m+':'+sec}<small>${c.points?m+':'+sec:'points à la fin'}</small></div>`}
      else if(x)p=`<div class="p">${x.points} pts<small>${esc(x.detail)}</small></div>`;
    }
    h+=`<div class="row${i===r?' cur':''}${i<r?' done':''}"><div class="t"><b>${i}</b>${hh(i)}</div><div class="bar" style="background:${A[s.k][1]}"></div><div class="d"><b>${A[s.k][0]}</b><div>${who(s)}</div></div>${p}</div>`;
  }
  h+='<p class="mut">Horaires indicatifs : suivez le signal des organisateurs.</p><a class="btn wide" href="#/planning">Planning général</a>';
  app.innerHTML=h;
}
async function loadTeam(t){
  const me=ls.get('me');
  try{
    if(me&&me.team===t){const d=await rpc('team_view',{p_token:me.token});if(d){ls.set('view',d);setRot(d.rotation)}}
    else{const s=await rpc('public_state');setRot(s.rotation)}
  }catch(e){}
  if(location.hash==='#/equipe/'+t)team(t);
}
async function scan(tok){
  app.innerHTML='<p>Connexion à votre équipe…</p>';
  try{
    const d=await rpc('team_view',{p_token:tok});
    if(!d){app.innerHTML='<h1>Code inconnu</h1><p>Ce QR code n\'est pas reconnu. Demandez à un organisateur.</p><a class="btn wide" href="#/">Accueil</a>';return}
    ls.set('me',{team:d.team,token:tok});ls.set('view',d);setRot(d.rotation);location.replace('#/equipe/'+d.team);
  }catch(e){app.innerHTML='<h1>Pas de réseau</h1><p>Impossible de vérifier le code pour le moment.</p><button class="wide dark" onclick="route()">Réessayer</button>'}
}

/* ---------- Planning général ---------- */
function planning(){
  let h='<h1>Planning général</h1><div class="scroll"><table class="plan"><tr><th>Rot.</th>';
  for(const k of K)h+=`<th style="background:${A[k][1]};color:#111">${A[k][0]}</th>`;
  h+='</tr>';
  G.forEach((g,i)=>{
    h+=`<tr${i+1===ROT?' style="background:#fff7d6"':''}><td><b>${i+1}</b><br><span class="mut">${hh(i+1)}</span></td>`;
    h+=`<td style="white-space:nowrap">${g[0][0].join('+')}<br>vs<br>${g[0][1].join('+')}</td>`;
    for(let j=1;j<6;j++)h+=`<td style="white-space:nowrap">${g[j].join(' – ')}</td>`;
    h+=`<td>${g[6].join(', ')}</td><td class="mut">${g[7].join(', ')}</td></tr>`;
  });
  app.innerHTML=h+'</table></div><p class="mut">Faites défiler le tableau vers la droite pour voir toutes les épreuves.</p><a class="btn wide" href="#/">Accueil</a>';
}

/* ---------- Organisateurs ---------- */
let O={tab:'saisie',rot:1,data:null,busy:false};
const code=()=>{try{return sessionStorage.getItem('orga')||localStorage.getItem('orga')}catch(e){return null}};
function orgaLogin(msg){
  app.innerHTML=`<h1>Espace organisateurs</h1><div class="card"><p>Entrez le code organisateur.</p><input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code" aria-label="Code organisateur"><button class="dark wide" id="go">Entrer</button>${msg?`<p style="color:var(--warn);font-weight:600">${msg}</p>`:''}</div>`;
  const go=async()=>{
    const v=$('#c').value.trim();if(!v)return;$('#go').disabled=true;
    try{const d=await rpc('orga_all',{p_code:v});if(!d)return orgaLogin('Code incorrect.');try{localStorage.setItem('orga',v)}catch(e){}O.data=d;setRot(d.rotation);O.rot=Math.min(NR,Math.max(1,d.rotation));orga()}
    catch(e){orgaLogin('Pas de réseau, réessayez.')}
  };
  $('#go').onclick=go;$('#c').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function orgaLoad(){
  try{const d=await rpc('orga_all',{p_code:code()});if(!d){ls.del('orga');return orgaLogin('Code incorrect.')}O.data=d;setRot(d.rotation);if(location.hash==='#/orga'&&!O.busy)orga()}
  catch(e){if(!O.data)orgaLogin('Pas de réseau, réessayez.')}
}
function matches(r){ // les 7 rencontres notées d'une rotation
  const g=G[r-1], m=[{k:'beret',a:g[0][0],b:g[0][1]}];
  for(let i=1;i<6;i++)m.push({k:K[i],a:[g[i][0]],b:[g[i][1]]});
  return m;
}
function options(m){
  const a=eq(m.a), b=eq(m.b);
  if(m.k==='sumo')return[[a+' gagne · 2 restants',6,0,'Victoire (2 restants)','Défaite'],[a+' gagne · 1 restant',3,0,'Victoire (1 restant)','Défaite'],['Égalité',2,2,'Égalité','Égalité'],[b+' gagne · 1 restant',0,3,'Défaite','Victoire (1 restant)'],[b+' gagne · 2 restants',0,6,'Défaite','Victoire (2 restants)']];
  const v=m.a.length>1?' gagnent':' gagne';
  return[[a+v,5,0,'Victoire','Défaite'],['Égalité',2,2,'Égalité','Égalité'],[b+v,0,5,'Défaite','Victoire']];
}
function pts(r,k,t){const x=O.data.results.find(x=>x.rotation===r&&x.activity===k&&x.team===t);return x?x.points:null}
function orga(){
  if(!code())return orgaLogin();
  if(!O.data){app.innerHTML='<p>Chargement…</p>';return orgaLoad()}
  const d=O.data;
  let h=`<h1>Organisateurs</h1><div class="card"><div class="mut">Rotation affichée aux équipes</div><div class="stepper"><button data-rot="${d.rotation-1}" ${d.rotation<1?'disabled':''} aria-label="Rotation précédente">◀</button><div>${rotLabel(d.rotation)}</div><button class="dark" data-rot="${d.rotation+1}" ${d.rotation>NR?'disabled':''} aria-label="Rotation suivante">▶</button></div></div>`;
  h+='<div class="tabs">'+[['saisie','Résultats'],['chasse','Chasse'],['classement','Classement']].map(([k,n])=>`<button data-tab="${k}" class="${O.tab===k?'on':''}">${n}</button>`).join('')+'</div>';
  if(O.tab==='saisie'){
    h+='<div class="rots">';
    for(let r=1;r<=NR;r++){const n=matches(r).filter(m=>pts(r,m.k,m.a[0])!==null).length;h+=`<button data-r="${r}" class="${r===O.rot?'on':''}${r===d.rotation?' live':''}">${r}<span class="mut" style="font-size:11px;margin-left:4px;color:inherit;opacity:.7">${n}/6</span></button>`}
    h+='</div>';
    for(const m of matches(O.rot)){
      const pa=pts(O.rot,m.k,m.a[0]), pb=pts(O.rot,m.k,m.b[0]);
      h+=`<div class="card match"><h3><span class="dot" style="background:${A[m.k][1]}"></span>${A[m.k][0]}</h3><div class="mut">${eq(m.a)} contre ${eq(m.b)}${pa===null?'':' · enregistré'}</div><div class="opts">`;
      options(m).forEach((o,i)=>{h+=`<button data-k="${m.k}" data-i="${i}" class="${pa===o[1]&&pb===o[2]?'on':''}">${o[0]}<span>${o[1]} – ${o[2]}</span></button>`});
      h+='</div></div>';
    }
    h+='<p class="mut">Touchez un résultat pour l\'enregistrer. Touchez-le à nouveau pour l\'effacer.</p>';
  }else if(O.tab==='chasse'){
    const n=d.chasse.length;
    h+=`<div class="card"><p class="mut">Temps de chaque équipe. Le plus rapide marque 19 points, puis 18, 17… ${n}/19 temps saisis${n<NT?' : les points sont provisoires et restent masqués aux équipes tant qu\'il en manque.':'.'}</p>`;
    for(let t=1;t<=NT;t++){
      const c=d.chasse.find(x=>x.team===t), rr=G.findIndex(g=>g[6].includes(t))+1;
      h+=`<div class="ch"><div><b>Équipe ${t}</b><small>rotation ${rr}${c?' · '+c.points+' pts':''}</small></div><input inputmode="numeric" id="m${t}" placeholder="min" aria-label="Minutes équipe ${t}" value="${c?Math.floor(c.seconds/60):''}"><input inputmode="numeric" id="s${t}" placeholder="sec" aria-label="Secondes équipe ${t}" value="${c?c.seconds%60:''}"><button data-ch="${t}" class="${c?'':'dark'}">OK</button></div>`;
    }
    h+='</div><p class="mut">Pour effacer un temps, videz les deux cases puis touchez OK.</p>';
  }else{
    const rows=[];
    for(let t=1;t<=NT;t++){const e=d.results.filter(x=>x.team===t), c=d.chasse.find(x=>x.team===t);const ep=e.reduce((s,x)=>s+x.points,0), cp=c?c.points:0;rows.push({t,ep,cp,has:!!c,tot:ep+cp,n:e.length})}
    rows.sort((a,b)=>b.tot-a.tot||a.t-b.t);
    const fin=d.chasse.length===NT, saved=d.results.length;
    h+=`<p class="mut">Visible uniquement ici. ${saved} résultats d'équipe saisis${fin?'':' · chasse au trésor provisoire ('+d.chasse.length+'/19 temps)'}.</p><table><tr><th>Rang</th><th class="l">Équipe</th><th>Épreuves</th><th>Chasse</th><th>Total</th></tr>`;
    rows.forEach((x,i)=>{const rk=rows.findIndex(y=>y.tot===x.tot)+1;h+=`<tr><td><b>${rk}</b></td><td class="l">Équipe ${x.t}</td><td>${x.ep}</td><td>${x.has?x.cp+(fin?'':'*'):'–'}</td><td><b>${x.tot}</b></td></tr>`});
    h+='</table><button class="wide" id="out" style="margin-top:20px">Se déconnecter</button>';
  }
  app.innerHTML=h;
}
app.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!location.hash.startsWith('#/orga')||!O.data)return;
  const ds=b.dataset;
  if(ds.tab){O.tab=ds.tab;return orga()}
  if(ds.r){O.rot=+ds.r;return orga()}
  if(b.id==='out'){ls.del('orga');try{sessionStorage.removeItem('orga');localStorage.removeItem('orga')}catch(e){}O.data=null;return orgaLogin()}
  if(O.busy)return;
  let call;
  if(ds.rot!==undefined){const n=+ds.rot;call=()=>rpc('orga_rotation',{p_code:code(),p_n:n});if(n>=1&&n<=NR)O.rot=n}
  else if(ds.k){
    const m=matches(O.rot).find(x=>x.k===ds.k), o=options(m)[+ds.i], clear=b.classList.contains('on');
    const rows=[...m.a.map(t=>({team:t,points:clear?null:o[1],detail:o[3]})),...m.b.map(t=>({team:t,points:clear?null:o[2],detail:o[4]}))];
    call=()=>rpc('orga_save',{p_code:code(),p_rotation:O.rot,p_activity:m.k,p_rows:rows});
  }else if(ds.ch){
    const t=+ds.ch, mv=$('#m'+t).value.trim(), sv=$('#s'+t).value.trim();
    let sec=null;
    if(mv!==''||sv!==''){sec=(parseInt(mv||'0',10)||0)*60+(parseInt(sv||'0',10)||0);if(!(sec>0&&sec<=36000)||(parseInt(sv||'0',10)||0)>59)return toast('Temps invalide')}
    call=()=>rpc('orga_chasse',{p_code:code(),p_team:t,p_seconds:sec});
  }else return;
  O.busy=true;b.disabled=true;
  try{const ok=await call();if(!ok)throw 0;O.data=await rpc('orga_all',{p_code:code()});setRot(O.data.rotation);toast('Enregistré',true)}
  catch(err){toast('Non enregistré : pas de réseau ?')}
  O.busy=false;orga();
});

/* ---------- Routage ---------- */
function route(){
  clearInterval(timer);$('#toast').style.display='none';
  const p=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(p[0]==='equipe'&&+p[1]>=1&&+p[1]<=NT){const t=+p[1];team(t);loadTeam(t);timer=setInterval(()=>{if(!document.hidden)loadTeam(t)},20000)}
  else if(p[0]==='k'&&p[1])scan(p[1]);
  else if(p[0]==='planning')planning();
  else if(p[0]==='orga'){orga();if(code()&&O.data)orgaLoad();timer=setInterval(()=>{if(!document.hidden&&code()&&!O.busy&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))orgaLoad()},20000)}
  else home();
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)route()});
setRot(ROT);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
